:root{
  --ink:#111411;--paper:#F4F3EC;--n1:#E9E5F0;--n2:#B9B4C2;--n3:#6F6979;--n4:#302C38;
  --lime:#D7FF00;--violet:#8757E8;--lav:#C6B1FF;--orange:#FF6A2E;
  --u:1;--accent:var(--lime);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#E9E7DF;
  background-image:radial-gradient(circle at 50% 40%,#F4F3EC 0,#E2E0D8 100%);
  font-family:"GS",system-ui,"PingFang SC",sans-serif;font-weight:500;color:var(--paper);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
#screen{
  position:relative;overflow:hidden;background:var(--ink);
  width:calc(360px * var(--u));height:calc(var(--h,780) * 1px * var(--u));
  border-radius:calc(14px * var(--u));
  touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 0 0 calc(10px * var(--u)) #F4F3EC,0 0 0 calc(11px * var(--u)) #B9B4C2,0 calc(18px * var(--u)) calc(40px * var(--u)) rgba(48,44,56,.25);
}
body.phone{display:block}
body.phone #screen{border-radius:0;box-shadow:none;margin:0}
#gcv,#cv{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#gcv{z-index:0}
#cv{z-index:1;image-rendering:pixelated;image-rendering:crisp-edges}
.glow{text-shadow:0 0 calc(6px * var(--u)) rgba(244,243,236,.28)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

#crt{position:absolute;inset:0;z-index:40;pointer-events:none;border-radius:inherit}
#crt .scan{position:absolute;inset:0;
  background:
    linear-gradient(rgba(17,20,17,0) 50%,rgba(0,0,0,.26) 50%),
    linear-gradient(90deg,rgba(244,243,236,.035),rgba(185,180,194,.0),rgba(198,177,255,.03));

  function rect(c,col,x,y,w,h){ c.strokeStyle=col; c.lineWidth=1; c.strokeRect((x|0)+0.5,(y|0)+0.5,w-1,h-1); }

  function stampLine(ax,ay,bx,by,w,kind){
    var dx=bx-ax, dy=by-ay, len=Math.max(1,Math.hypot(dx,dy));
    var n=Math.ceil(len)+2, i, t, x, y, k, j;
    for(i=0;i<=n;i++){
      t=i/n; x=Math.round(ax+dx*t); y=Math.round(ay+dy*t);
      for(k=-w;k<=w;k++) for(j=-w;j<=w;j++){
        if(k*k+j*j>w*w+1) continue;
        var tx=x+k, ty=y+j;
        if(tx<0||ty<0||tx>=COLS||ty>=ROWS) continue;
        land[idx(tx,ty)]=kind;
        walk[idx(tx,ty)]=1;
      }
    }
  }
  function stampPlaza(cx,cy,r,kind){
    var x,y;
    for(y=cy-r;y<=cy+r;y++) for(x=cx-r;x<=cx+r;x++){
      if(x<0||y<0||x>=COLS||y>=ROWS) continue;
      land[idx(x,y)]=kind;
      walk[idx(x,y)]=1;
    }
  }
  function forceRect(x0,y0,x1,y1,kind,canWalk){
    var x,y;
    for(y=y0;y<=y1;y++) for(x=x0;x<=x1;x++){
      if(x<0||y<0||x>=COLS||y>=ROWS) continue;
      land[idx(x,y)]=kind;
      if(canWalk) walk[idx(x,y)]=1;
    }
  }

  /* kind: 0 sea, 1 land, 2 shore, 3 path, 4 plaza, 5 dock, 6 pier */
  function buildGrid(){
    walk=new Uint8Array(COLS*ROWS);
    land=new Uint8Array(COLS*ROWS);
    var x,y,k;
    for(y=0;y<ROWS;y++) for(x=0;x<COLS;x++){
      if(inIsland(x,y)){ land[idx(x,y)]=1; walk[idx(x,y)]=1; }
    }
    for(y=0;y<ROWS;y++) for(x=0;x<COLS;x++){
      if(land[idx(x,y)]!==1) continue;
      var shore=false;
      for(k=0;k<4;k++){
        var nx=x+(k===0?1:k===1?-1:0), ny=y+(k===2?1:k===3?-1:0);
        if(nx<0||ny<0||nx>=COLS||ny>=ROWS||land[idx(nx,ny)]===0){ shore=true; break; }
      }
      if(shore) land[idx(x,y)]=2;
    }
    /* 主路 南入口 → 雾雾 → 路口 → 北 风儿；东折 阿拼码头 */
    stampLine(45,230,45,200,2,3);
    stampLine(45,200,45,178,2,3);
    stampLine(45,178,45,138,2,3);
    stampLine(45,138,58,138,2,3);
    stampLine(58,138,70,138,2,3);
    stampLine(45,138,45,100,2,3);
    stampLine(45,100,45,62,2,3);
    /* 支路 */
    stampLine(45,200,30,198,1,3);
    stampLine(36,178,28,168,1,3);
    stampLine(45,100,58,96,1,3);
    stampLine(45,230,52,236,1,3);
    stampPlaza(45,218,4,4);
    stampPlaza(45,178,5,4);
    stampPlaza(45,138,3,4);
    stampPlaza(45,62,5,4);
    stampPlaza(70,138,3,4);
    /* 码头台 + 伸进海里的栈桥 */
    forceRect(66,134,76,144,5,1);
    forceRect(76,136,88,140,6,1);
  }

  function drawPine(c, px, py, h){
    var i, w, y;
    for(i=0;i<h;i++){
      w=Math.max(1, Math.ceil((h-i)*0.55));
      y=py-i*TW;
      fill(c, (i%3===2)?MIST:SLATE, px-w*2, y, w*4, TW);
    }
    fill(c, INK, px-1, py+2, 2, 4);
  }

  function drawTreeHole(c, cx, cy){
    var chunks=[[-40,-8,28,40],[16,-4,32,36],[-24,-36,52,28],[-16,-52,36,20],[-32,24,68,20],[ -48,12,16,16],[36,16,18,14]];
    var i,b;
    for(i=0;i<chunks.length;i++){
      b=chunks[i];
      fill(c, (i%2)?SLATE:'#3e4240', cx+b[0], cy+b[1], b[2], b[3]);
    }
    /* 洞口 */
    fill(c, INK, cx-16, cy-18, 32, 28);
    fill(c, '#0a0c0a', cx-12, cy-14, 24, 22);
    fill(c, LIME, cx-1, cy-2, 3, 3);
  }

  function drawHut(c, cx, cy){
    var r, a, i;
    /* 圆形台，不是普通小屋 */
    for(r=28;r>=8;r-=6){
      c.strokeStyle=r%12===8?PAPER:SLATE;
      c.lineWidth=2;
      c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2); c.stroke();
    }
    fill(c, INK, cx-10, cy-10, 20, 20);
    rect(c, PAPER, cx-8, cy-8, 16, 16);
    /* 风铃柱 */
    var posts=[-26,0,26];
    for(i=0;i<posts.length;i++){
      fill(c, SLATE, cx+posts[i]-1, cy-52, 2, 52);
      fill(c, PAPER, cx+posts[i]-3, cy-44, 2, 10);
      fill(c, PAPER, cx+posts[i]+1, cy-38, 2, 8);
      fill(c, MIST,  cx+posts[i]-2, cy-28, 2, 6);
    }
    fill(c, LIME, cx+26-1, cy-46, 2, 2);
    /* 地面旋纹 */
    c.strokeStyle=MIST; c.lineWidth=1;
    for(i=0;i<3;i++){
      c.beginPath();
      for(a=0;a<Math.PI*1.6;a+=0.15){
        var rr=18+i*8+a*2;
        var x=cx+Math.cos(a+i)*rr, y=cy+Math.sin(a+i)*rr*0.7;
        if(a<0.16) c.moveTo(x,y); else c.lineTo(x,y);
      }
      c.stroke();
    }
  }

  function drawDockDecor(c){
    var x,y,i;
    /* 栈桥木纹已经在铺砖时画；这里加桩、船 */
    for(i=0;i<5;i++){
      x=(78+i*2)*TW; y=136*TW;
      fill(c, INK, x+2, y-6, 3, 18);
      fill(c, SLATE, x+1, y-8, 5, 3);
    }
    /* 两艘几何小船（水上，不可走） */
    drawBoat(c, 80*TW, 144*TW, 28, 1);
    drawBoat(c, 84*TW, 132*TW, 22, -1);
    /* 货箱 */
    fill(c, SLATE, 67*TW, 135*TW, 10, 8);
    rect(c, PAPER, 67*TW, 135*TW, 10, 8);
    fill(c, SLATE, 68*TW+1, 141*TW, 8, 6);
    rect(c, MIST, 68*TW+1, 141*TW, 8, 6);
  }
  function drawBoat(c, x, y, w, dir){
    var h=8;
    c.fillStyle=PAPER;
    c.beginPath();
    c.moveTo(x, y);
    c.lineTo(x+w, y+dir*2);
    c.lineTo(x+w-4, y+h);
    c.lineTo(x+3, y+h-1);
    c.closePath(); c.fill();
    c.strokeStyle=INK; c.lineWidth=1; c.stroke();
    fill(c, SLATE, x+w*0.45, y-10, 2, 12);
    fill(c, MIST, x+w*0.45-4, y-10, 8, 3);
  }

  function paintTile(c, kind, tx, ty){
    var x=tx*TW, y=ty*TW, n=hash(tx,ty), parity=(tx+ty)&1;
    if(kind===0){
      /* 海：纯墨，几乎不打点，和陆地区分开 */
      if(n>0.985) fill(c, '#1a1c1a', x+(n*11)|0, y+((n*7)%11)|0, 1, 1);
      return;
    }
    if(kind===2){
      fill(c, parity?SLATE:'#3a3d3c', x, y, TW, TW);
      if(n>0.5) fill(c, MIST, x+2, y+2, 2, 2);
      return;
    }
    if(kind===3){
      fill(c, PAPER, x, y, TW, TW);
      c.strokeStyle='rgba(17,20,17,.28)'; c.lineWidth=1;
      c.strokeRect(x+0.5,y+0.5,TW-1,TW-1);
      return;
    }
    if(kind===4){
      fill(c, PAPER, x, y, TW, TW);
      c.strokeStyle='rgba(17,20,17,.45)'; c.lineWidth=1;
      c.strokeRect(x+0.5,y+0.5,TW-1,TW-1);
      if((tx+ty)%4===0) fill(c, INK, x+TW/2-1, y+TW/2-1, 2, 2);
      return;
    }
    if(kind===5||kind===6){
      fill(c, (ty&1)?SLATE:'#8a8d8a', x, y, TW, TW);
      fill(c, PAPER, x, y+(ty&1?2:1), TW, 1);
      if(kind===6 && (tx%3===0)) fill(c, INK, x+TW-2, y, 2, TW);
      return;
    }
    /* 陆地块：深灰底 + 成团岩块，让岛体从海里跳出来 */
    fill(c, parity?'#1c201e':'#161916', x, y, TW, TW);
    var mass=noise(tx*0.11, ty*0.11);
    if(mass>0.50){
      fill(c, parity?SLATE:'#55585a', x, y, TW, TW);
      if(n>0.7) fill(c, MIST, x+2, y+3, 3, 2);
    } else if(mass>0.38){
      fill(c, '#2c302e', x, y, TW, TW);
      if(parity) fill(c, SLATE, x+2, y+2, TW-4, TW-4);
    } else if(n>0.55){
      fill(c, '#2a2e2c', x+2, y+2, 4, 4);
    }
  }

  function buildMap(){
    buildGrid();
    mapCv=document.createElement('canvas');
    mapCv.width=MW; mapCv.height=MH;
    mapCtx=mapCv.getContext('2d');
    var c=mapCtx, x,y,kind;
    fill(c, INK, 0, 0, MW, MH);
    for(y=0;y<ROWS;y++) for(x=0;x<COLS;x++){
      kind=land[idx(x,y)];
      paintTile(c, kind, x, y);
    }
    /* 岸线点（动画浪用） */
    shores.length=0;
    for(y=1;y<ROWS-1;y++) for(x=1;x<COLS-1;x++){
      kind=land[idx(x,y)];
      if(kind===0) continue;
      var sea= land[idx(x+1,y)]===0||land[idx(x-1,y)]===0||land[idx(x,y+1)]===0||land[idx(x,y-1)]===0;
      if(sea){ shores.push(x*TW+6, y*TW+6); }
    }
    /* 雾雾园区：更多松与雾斑 */
    var pines=[[38,190,7],[32,184,6],[52,186,8],[40,166,7],[54,170,5],[28,176,5],[50,198,6],[34,198,8],[58,160,6],[40,200,5]];
    pines.forEach(function(p){ drawPine(c, p[0]*TW, p[1]*TW, p[2]); });
    drawTreeHole(c, 45*TW+6, 178*TW-8);
    /* 风儿园区松少、旋纹多：小屋已自带旋纹，再散几棵细松 */
    drawHut(c, 45*TW+6, 62*TW+4);
    drawPine(c, 32*TW, 70*TW, 5);
    drawPine(c, 58*TW, 74*TW, 6);
    drawPine(c, 38*TW, 50*TW, 4);
    /* 入口几棵 */
    drawPine(c, 34*TW, 226*TW, 5);
    drawPine(c, 56*TW, 224*TW, 6);
    drawPine(c, 30*TW, 210*TW, 4);
    drawDockDecor(c);
    /* 雾雾区预烘一层稀疏雾点 */
    for(y=155;y<210;y++) for(x=28;x<62;x++){
      if(land[idx(x,y)]===0) continue;
      if(((x*3+y*7)&7)===0) fill(c, MIST, x*TW+((x*y)%9), y*TW+((x+y)%8), 2, 2);
    }
    buildFogTile();
    buildSceneAssets();
  }

  function buildFogTile(){
    fogTile=document.createElement('canvas');
    fogTile.width=128; fogTile.height=128;
    var f=fogTile.getContext('2d'), i,j;
    for(j=0;j<128;j++) for(i=0;i<128;i++){
      if(((i>>1)+(j>>1)+((i*j)>>5))&1){
        if(hash(i,j)>0.45){ f.fillStyle='rgba(218,219,211,.55)'; f.fillRect(i,j,1,1); }
      }
    }
  }

  function buildSceneAssets(){
    /* 前景草影（预模糊一次） */
    var raw=document.createElement('canvas'); raw.width=360; raw.height=220;
    var r=raw.getContext('2d');
    r.fillStyle=INK;
    var i, x;
    for(i=0;i<28;i++){
      x=i*14-8+(hash(i,3)*10);
      r.beginPath();
      r.moveTo(x,220);
      r.lineTo(x+4, 80+hash(i,1)*80);
      r.lineTo(x+10,220);
      r.fill();
      /* 叶簇 */
      r.fillRect(x-4, 90+hash(i,5)*70, 14, 8);
    }
    r.fillRect(0,200,360,24);
    fgGrass=document.createElement('canvas'); fgGrass.width=360; fgGrass.height=220;
    var g=fgGrass.getContext('2d');
    g.filter='blur(2.2px)';
    g.drawImage(raw,0,0);
    g.filter='none';
    /* 再叠一层清晰的近草，形成 dither/dof 对比 */
    g.globalAlpha=0.85; g.fillStyle=INK;
    for(i=0;i<18;i++){
      x=i*22-6;
      g.fillRect(x, 170+((i*5)%18), 3, 50);
      g.fillRect(x+5, 185, 2, 36);
    }
    /* 神光 */
    raysCv=document.createElement('canvas'); raysCv.width=360; raysCv.height=500;
    var v=raysCv.getContext('2d');
    v.translate(80, -20);
    for(i=0;i<7;i++){
      var a=-0.55+i*0.13;
      v.save(); v.rotate(a);
      var grd=v.createLinearGradient(0,0,0,520);
      grd.addColorStop(0,'rgba(215,255,0,0.16)');
      grd.addColorStop(0.4,'rgba(215,255,0,0.05)');
      grd.addColorStop(1,'rgba(215,255,0,0)');
      v.fillStyle=grd;
      v.beginPath(); v.moveTo(-6-i,0); v.lineTo(8+i*2,0); v.lineTo(70+i*10,520); v.lineTo(-40-i*8,520); v.fill();
      v.restore();
    }
  }

  function paintLabels(){
    if(!mapCtx) return;
    var c=mapCtx;
    function plate(text, sub, x, y){
      c.font='700 11px GS,sans-serif';
      var tw=c.measureText(text).width;
      var w=Math.max(tw+16, 86), h=28;
      fill(c, INK, x-w/2, y-h, w, h);
      rect(c, PAPER, x-w/2+1, y-h+1, w-2, h-2);
      c.fillStyle=PAPER; c.textAlign='center';
      c.font='700 11px GS,sans-serif';
      c.fillText(text, x, y-12);
      c.font='500 8px GS,sans-serif';
      c.fillStyle=MIST;
      c.fillText(sub, x, y-3);
      fill(c, LIME, x-1, y-h-3, 2, 3);
    }
    plate('雾雾的闪烁树洞','园区', 45*TW+6, 178*TW-70);
    plate('阿拼的拼装码头','园区', 70*TW, 134*TW-36);
    plate('风儿的回声小屋','园区', 45*TW+6, 62*TW-70);
    labelsReady=true;
  }

  /* ----- 小土豆 16×16 像素（画在离屏，再 nearest 贴） ----- */
  var potCv=(function(){
    var c=document.createElement('canvas'); c.width=16; c.height=16;
    var g=c.getContext('2d'), p=PAPER, k=INK, l=LIME;
    function d(col,x,y,w,h){ g.fillStyle=col; g.fillRect(x,y,w||1,h||1); }
    d(p,5,1,6,1); d(p,4,2,8,1); d(p,3,3,10,8);
    d(p,4,11,8,1); d(p,5,12,6,1);
    d(k,5,5,2,4); d(k,9,5,2,4);
    d(l,11,10,2,2);
    d(p,5,13,2,2); d(p,9,13,2,2);
    d(k,5,15,2,1); d(k,9,15,2,1);
    return c;
  })();
  var snailCv=(function(){
    var c=document.createElement('canvas'); c.width=16; c.height=12;
    var g=c.getContext('2d');
    g.fillStyle=SLATE; g.fillRect(5,1,8,8); g.fillRect(6,0,6,1);
    g.fillStyle=PAPER; g.fillRect(7,3,4,4); g.fillRect(8,2,2,1);
    g.fillStyle=INK; g.fillRect(8,4,2,2);
    g.fillStyle=PAPER; g.fillRect(1,7,6,3); g.fillRect(0,8,2,2);
    g.fillStyle=LIME; g.fillRect(12,2,2,2);
    return c;
  })();

  function zoneAt(x,y){
    var tx=x/TW, ty=y/TW;
    if(tx>58 && ty>120 && ty<155) return '阿拼的拼装码头';
    if(ty>155 && ty<210 && tx>24 && tx<66) return '雾雾的闪烁树洞';
    if(ty>40 && ty<95 && tx>28 && tx<62) return '风儿的回声小屋';
    if(ty>210) return '南岸入口';
    return '海边小径';
  }

  function closestNpc(x,y){
    var i, best=null, bestD=1e9, d, n;
    for(i=0;i<NPCS.length;i++){
      n=NPCS[i]; d=Math.hypot(n.x-x, n.y-y);
      if(d<bestD){ bestD=d; best=n; }
    }
    return {npc:best, d:bestD};
  }

  /* ===== 对话 / 终端（复用 v3 打字机 + 块光标 + 升起面板） ===== */
  var caret=document.createElement('span'); caret.className='caret';
  var dlgNpc=null, dlgLines=null, dlgIdx=0, dlgAfter=false, dlgOnDone=null;
  function typeInto(el, text, speed, done){
    var i=0; el.textContent=''; el.appendChild(caret);
    var tn=document.createTextNode(''); el.insertBefore(tn, caret);
    var t=setInterval(function(){
      i++; tn.nodeValue=text.slice(0,i);
      if(i>=text.length){ clearInterval(t); done&&done(); }
    }, speed);
    typers.push({stop:function(){ clearInterval(t); tn.nodeValue=text; }, el:el});
  }
  function finishTyping(){
    typers.forEach(function(t){ t.stop(); }); typers=[];
    if(ansQ){
      tQ.textContent=ansQ.stem; tQ.appendChild(caret);
      Array.prototype.forEach.call(tOpts.children, function(li,k){
        li.classList.add('show'); li.querySelector('.tx').textContent=ansQ.opts[k][1];
      });
      talkLive=false;
      setTimeout(function(){ ansLocked=false; term.classList.add('ready'); }, 200);
      updateMore();
    }
  }
  function closeDlg(){
    typers.forEach(function(t){ t.stop(); }); typers=[];
    dlg.hidden=true; dlgNpc=null; dlgLines=null; talkLive=false;
    if(mode==='map'){ paused=false; hintEl.classList.remove('off'); }
  }
  function openMapTalk(np){
    var L=LINES[np.id]; if(!L) return;
    var lines=L.intro;
    if(np.id==='snail' && snailTalked) lines=L.revisit;
    if(np.id==='snail') snailTalked=true;
    dlgNpc=np; dlgLines=lines; dlgIdx=0; dlgAfter=false;
    document.getElementById('dName').textContent=L.name;
    document.getElementById('dPlace').textContent=L.place+(L.note?' · '+L.note:'');
    document.getElementById('dHint').textContent='点按继续';
    document.getElementById('dLeave').textContent='关闭';
    dlg.hidden=false; paused=true; hintEl.classList.add('off');
    speakLine();
  }
  function speakLine(){
    typers.forEach(function(t){ t.stop(); }); typers=[];
    var text=dlgLines[dlgIdx];
    typeInto(dBody, text, 38, function(){ talkLive=false; });
    talkLive=true;
  }
  function nextDlg(){
    if(talkLive){ typers.forEach(function(t){ t.stop(); }); typers=[]; talkLive=false; dBody.textContent=dlgLines[dlgIdx]; dBody.appendChild(caret); return; }
    dlgIdx++;
    if(dlgIdx<dlgLines.length){ speakLine(); return; }
    /* 阿拼 intro 完 → 终端出题；after 完 → 可离开 */
    if(dlgNpc && dlgNpc.id==='apin' && !dlgAfter && !answered['I1-1']){
      closeDlg(); enterAnswer(); return;
    }
    closeDlg();
  }
  dlg.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  dlg.addEventListener('click', function(e){
    if(e.target && e.target.id==='dLeave') return;
    nextDlg();
  });
  document.getElementById('dLeave').addEventListener('click', function(e){
    e.stopPropagation();
    closeDlg();
    if(mode==='scene' || mode==='to-scene') startExit();
  });

  var ansQ=null, ansLocked=true, ansTimers=typers;
  function enterAnswer(){
    var q=Q_I11;
    ansQ=q; ansLocked=true; talkLive=true; paused=true;
    document.getElementById('tName').textContent='阿拼';
    document.getElementById('tPlace').textContent='拼装码头';
    document.getElementById('tCnt').textContent='I1-1 · 01/01';
    tLead.textContent=q.lead; tQ.textContent=''; tOpts.innerHTML=''; term.classList.remove('ready');
    q.opts.forEach(function(o,k){
      var li=document.createElement('li'); li.dataset.code=o[0];
      li.innerHTML='<span class="k num">'+String.fromCharCode(65+k)+'</span><span class="tx"></span>';
      li.addEventListener('click', function(){ choose(k, li); });
      tOpts.appendChild(li);
    });
    tScroll.scrollTop=0; updateMore();
    termWant=1; term.classList.add('on'); term.setAttribute('aria-hidden','false'); hintEl.classList.add('off');
    typers=[];
    setTimeout(function(){
      if(ansQ!==q) return;
      typeInto(tQ, q.stem, 42, function(){ revealOpt(0); });
    }, 420);
  }
  function revealOpt(k){
    var lis=tOpts.children; if(!ansQ) return;
    if(k>=lis.length){ talkLive=false; tQ.appendChild(caret); setTimeout(function(){ ansLocked=false; term.classList.add('ready'); }, 300); updateMore(); return; }
    var li=lis[k]; li.classList.add('show');
    typeInto(li.querySelector('.tx'), ansQ.opts[k][1], 16, function(){ updateMore(); revealOpt(k+1); });
  }
  function updateMore(){ var more=tScroll.scrollHeight-tScroll.clientHeight-tScroll.scrollTop>6; tMore.classList.toggle('on', more); }
  tScroll.addEventListener('scroll', updateMore);
  term.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  term.addEventListener('click', function(e){ if(ansLocked && !e.target.closest('li.sel') && !e.target.closest('.t-leave')) finishTyping(); });
  function choose(k, li){
    if(ansLocked||!ansQ) return;
    ansLocked=true; term.classList.remove('ready');
    li.classList.add('sel');
    Array.prototype.forEach.call(tOpts.children, function(o){ if(o!==li) o.classList.add('unsel'); });
    var rec={q:ansQ.id, code:ansQ.opts[k][0], text:ansQ.opts[k][1], npc:'阿拼', t:Date.now()};
    answers.push(rec); answered[ansQ.id]=rec;
    if(!window.__holdExit) setTimeout(exitAnswer, 650);
  }
  function exitAnswer(){
    typers.forEach(function(t){ t.stop(); }); typers=[];
    termWant=0; term.classList.remove('on'); term.setAttribute('aria-hidden','true');
    var q=ansQ; ansQ=null; talkLive=false;
    if(answers.length){
      document.getElementById('pNow').textContent=String(answers.length).padStart(2,'0');
      document.getElementById('ruleDot').style.setProperty('--p', Math.min(1, answers.length/26));

    }

  }
  document.getElementById('tLeave').addEventListener('click', function(e){
    e.stopPropagation();

  /* ===== 进出小景 ===== */
  function startEnter(){
    if(mode!=='map') return;
    closeDlg();
    mode='to-scene'; transT=0; transDir=1; transFrozen=false; transDur=1000;
    paused=true; clearDirs(); dest=null; hintEl.classList.add('off');
  }
  function settleScene(){
    mode='scene'; transT=1; transFrozen=false; paused=true;
    document.getElementById('fSub').textContent='阿拼的拼装码头';
    document.getElementById('dName').textContent='阿拼';
    document.getElementById('dPlace').textContent='拼装码头';

      dlgNpc=NPCS[1]; dlgLines=LINES.apin.after; dlgIdx=0; dlgAfter=true;

      dlgNpc=NPCS[1]; dlgLines=LINES.apin.intro; dlgIdx=0; dlgAfter=false;
    }

  function startExit(){
    typers.forEach(function(t){ t.stop(); }); typers=[];
    dlg.hidden=true; termWant=0; term.classList.remove('on'); term.setAttribute('aria-hidden','true');

  function settleMap(){

  function interact(np){
    if(!np) return;
    if(mode!=='map') return;
    if(np.id==='apin'){ startEnter(); return; }
    openMapTalk(np);
  }

  /* ===== 输入 ===== */
  function clearDirs(){ dirs.left=dirs.right=dirs.fwd=dirs.back=false; }
  var KEYMAP={ArrowUp:'fwd',ArrowDown:'back',ArrowLeft:'left',ArrowRight:'right',w:'fwd',s:'back',a:'left',d:'right'};
  document.addEventListener('keydown', function(e){
    var k=KEYMAP[e.key]; if(k && !paused && mode==='map'){ dirs[k]=true; e.preventDefault(); dest=null; }
    if(e.key===' ' && nearId && dlg.hidden && !ansQ && mode==='map') interact(nearId);
    if(e.key==='Escape' && (mode==='scene'||mode==='to-scene')) startExit();
  });
  document.addEventListener('keyup', function(e){ var k=KEYMAP[e.key]; if(k) dirs[k]=false; });
  var drag=null, tap=null;
  screenEl.addEventListener('pointerdown', function(e){
    if(e.target.closest('button') || e.target.closest('.dlg') || e.target.closest('#term') || e.target.id==='fNum') return;
    if(mode!=='map' || !dlg.hidden || ansQ) return;
    drag={x:e.clientX,y:e.clientY}; tap={x:e.clientX,y:e.clientY,t:Date.now(),moved:false};
  });
  window.addEventListener('pointermove', function(e){
    if(!drag || paused || mode!=='map') return;
    var dx=e.clientX-drag.x, dy=e.clientY-drag.y, TH=16;
    if(tap && Math.abs(dx)+Math.abs(dy)>8) tap.moved=true;
    clearDirs(); dest=null;
    if(Math.abs(dx)>TH) dirs[dx>0?'right':'left']=true;
    if(Math.abs(dy)>TH) dirs[dy<0?'fwd':'back']=true;
  });
  window.addEventListener('pointerup', function(e){
    drag=null; clearDirs();
    if(tap && !tap.moved && Date.now()-tap.t<600 && mode==='map' && dlg.hidden && !ansQ) tapAt(e.clientX,e.clientY);
    tap=null;
  });
  function tapAt(clientX, clientY){
    var r=screenEl.getBoundingClientRect(), px=(clientX-r.left)/r.width*W, py=(clientY-r.top)/r.height*H;
    var wx=cam.x+px, wy=cam.y+py, i, n, d, hit=null, best=48;
    for(i=0;i<NPCS.length;i++){
      n=NPCS[i]; d=Math.hypot(n.x-wx, n.y-wy-8);
      if(d<best){ best=d; hit=n; }
    }
    if(hit){
      var dist=Math.hypot(hit.x-potato.x, hit.y-potato.y);
      if(dist<70) interact(hit);
      else dest={x:hit.x, y:hit.y, npc:hit};
      return;
    }
    if(walkablePx(wx, wy)) dest={x:wx, y:wy, npc:null};
  }

  /* ===== 绘制 ===== */
  function drawMapWorld(c, t){
    c.drawImage(mapCv, 0, 0);
    /* 岸边浪线 */
    var i, x, y, off, x0=cam.x-20, x1=cam.x+W+20, y0=cam.y-20, y1=cam.y+H+20;
    /* 过渡时 cam 会变，这里用传入的可见盒更稳：浪全图也行，shore 约 1k 点，可接受。只画视口。 */
    c.strokeStyle='rgba(244,243,236,.55)'; c.lineWidth=1; c.beginPath();
    for(i=0;i<shores.length;i+=2){
      x=shores[i]; y=shores[i+1];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      off=Math.sin(t*0.004+x*0.05+y*0.03)*2.4;
      c.moveTo(x-5, y+off); c.lineTo(x+5, y+off);
    }
    c.stroke();
    c.strokeStyle='rgba(218,219,211,.32)'; c.beginPath();
    for(i=0;i<shores.length;i+=2){
      x=shores[i]; y=shores[i+1];
      if(x<x0||x>x1||y<y0||y>y1) continue;
      off=Math.sin(t*0.003+x*0.04+1.7)*3 + 3;
      c.moveTo(x-4, y+off); c.lineTo(x+4, y+off);
    }
    c.stroke();
    /* 雾雾区滚动点阵雾 */
    c.save();
    c.beginPath();
    c.rect(28*TW, 155*TW, 34*TW, 55*TW);
    c.clip();
    c.globalAlpha=0.28+Math.sin(t*0.0012)*0.06;
    var fx=((t*0.02)%128), fy=((t*0.014)%128);
    var ox=28*TW-fx, oy=155*TW-fy, xx, yy;
    for(yy=oy; yy<210*TW; yy+=128) for(xx=ox; xx<62*TW; xx+=128) c.drawImage(fogTile, xx, yy);
    c.restore();
  }

  function bobY(n, t){
    if(holdBob!=null) return holdBob;
    var base=n.hover?5:0;
    return base + Math.sin(t*0.004 + n.x*0.01)*2;
  }

  function drawNpc(c, n, t){
    var by=bobY(n,t);
    if(n.id==='snail'){
      c.imageSmoothingEnabled=false;
      c.drawImage(snailCv, n.x-8, n.y-12-by, 16, 12);
      return;
    }
    var im=IM[n.id]; if(!im) return;
    var s=32*n.scale;
    c.imageSmoothingEnabled=false;
    c.drawImage(im, n.x-s/2, n.y-s-by, s, s);
  }

  function drawLimeMark(c, n, t){
    if(!n.interact) return;
    var y=n.y-32*n.scale-10-bobY(n,t)+(Math.sin(t*0.008)>0?1:0);
    c.fillStyle=LIME;
    c.beginPath();
    c.moveTo(n.x, y+5); c.lineTo(n.x-4, y); c.lineTo(n.x+4, y); c.closePath(); c.fill();
  }

  function drawPotato(c){
    c.imageSmoothingEnabled=false;
    c.drawImage(potCv, potato.x-12, potato.y-24, 24, 24);
  }

  function drawEdgeHints(c){
    var i,n,sx,sy,px,py;
    for(i=0;i<NPCS.length;i++){
      n=NPCS[i]; if(!n.interact || n.id==='snail') continue;
      sx=n.x-cam.x; sy=n.y-cam.y-20;
      if(sx>=16 && sx<=W-16 && sy>=40 && sy<=H-40) continue;
      px=clamp(sx, 14, W-14); py=clamp(sy, 70, H-50);
      c.fillStyle=LIME; c.globalAlpha=0.9;
      c.beginPath(); c.arc(px, py, 3, 0, Math.PI*2); c.fill();
      c.globalAlpha=1;
      c.fillStyle=PAPER; c.font='700 8px GS,sans-serif'; c.textAlign='center';
      c.fillText(LINES[n.id].name, px, py-6);
    }
  }

  function drawMinimap(c){
    if(!showMini) return;
    var mw=72, mh=104, x=W-mw-10, y=LAYOUT.top+6;
    fill(c, 'rgba(17,20,17,.82)', x-2, y-2, mw+4, mh+4);
    rect(c, PAPER, x-2, y-2, mw+4, mh+4);
    c.drawImage(mapCv, 0, 0, MW, MH, x, y, mw, mh);
    var vx=x+cam.x/MW*mw, vy=y+cam.y/MH*mh, vw=W/MW*mw, vh=H/MH*mh;
    c.strokeStyle=LIME; c.lineWidth=1; c.strokeRect(vx,vy,vw,vh);
    var i,n;
    c.fillStyle=LIME;
    for(i=0;i<NPCS.length;i++){
      n=NPCS[i]; if(n.id==='snail') continue;
      c.fillRect(x+n.x/MW*mw-1, y+n.y/MH*mh-1, 2, 2);
    }
    c.fillStyle=PAPER;
    c.fillRect(x+potato.x/MW*mw-1, y+potato.y/MH*mh-1, 3, 3);
  }

  /* HD-2D 阿拼小景 */
  var sceneApin={x:168, y:428};
  function drawScene(c, t, frameH){
    var sway=Math.sin(t*0.0007)*4, sway2=Math.sin(t*0.0011)*7;
    var h=frameH||H;
    /* 天空 */
    var sky=c.createLinearGradient(0,0,0,300);
    sky.addColorStop(0,'#0c0e0c');
    sky.addColorStop(0.55,'#161916');
    sky.addColorStop(1,'#2a2d2b');
    c.fillStyle=sky; c.fillRect(0,0,W,h);
    /* 远海与地平 */
    c.save(); c.translate(sway*0.3, 0);
    var sea=c.createLinearGradient(0,250,0,h);
    sea.addColorStop(0,'#1a1e1c');
    sea.addColorStop(0.35,'#151816');
    sea.addColorStop(1,INK);
    c.fillStyle=sea; c.fillRect(-10,258,W+20,h);
    c.fillStyle=MIST; c.globalAlpha=0.35; c.fillRect(-10,256,W+20,2); c.globalAlpha=1;
    /* 浪 */
    var i, yy, off;
    for(i=0;i<10;i++){
      yy=290+i*18;
      c.strokeStyle=i%3===0?'rgba(244,243,236,.28)':'rgba(218,219,211,.16)';
      c.lineWidth=1; c.beginPath();
      for(var xx=-10;xx<=W+10;xx+=8){
        off=Math.sin(t*0.003+xx*0.04+i*0.7)*2.2 + Math.sin(t*0.001+i)*1.2;
        if(xx<=-10) c.moveTo(xx, yy+off); else c.lineTo(xx, yy+off);
      }
      c.stroke();
    }
    c.restore();
    /* 神光 + 柔雾 */
    c.globalAlpha=0.85+Math.sin(t*0.001)*0.1;
    c.drawImage(raysCv, -20+sway*0.5, -10);
    c.globalAlpha=1;
    c.fillStyle='rgba(218,219,211,0.06)';
    c.fillRect(0, 180, W, 90);
    c.fillStyle='rgba(215,255,0,0.04)';
    c.fillRect(40, 80, 180, 200);
    /* 沙滩 */
    c.save(); c.translate(0, sway*0.2);
    c.fillStyle='#2e302c';
    c.beginPath(); c.moveTo(-10, 470); c.lineTo(W+10, 500); c.lineTo(W+10, h); c.lineTo(-10, h); c.fill();
    c.fillStyle=SLATE;
    for(i=0;i<40;i++){
      if((i+((t/400)|0))%2) c.fillRect((i*11+3)%W, 490+((i*7)%28), 3, 2);
    }
    /* 码头板块 */
    var dx=70, dy=400, dw=220, dh=86;
    c.fillStyle='#3a3d3a'; c.fillRect(dx, dy, dw, dh);
    for(i=0;i<9;i++){
      c.fillStyle=(i%2)?PAPER:'#d4d3cc';
      c.fillRect(dx+4, dy+6+i*8, dw-8, 5);
      c.fillStyle=INK; c.fillRect(dx+4, dy+11+i*8, dw-8, 1);
    }
    /* 桩 */
    c.fillStyle=INK; c.fillRect(dx+10, dy-16, 5, 28); c.fillRect(dx+dw-16, dy-16, 5, 28);
    c.fillStyle=SLATE; c.fillRect(dx+8, dy-18, 9, 4); c.fillRect(dx+dw-18, dy-18, 9, 4);
    /* 栈桥伸向右侧海里 */
    c.fillStyle='#3a3d3a'; c.fillRect(dx+dw-4, dy+28, 90, 22);
    for(i=0;i<6;i++){ c.fillStyle=PAPER; c.fillRect(dx+dw+i*14, dy+30, 12, 3); }
    /* 系着的小船 */
    c.translate(sway*0.4, Math.sin(t*0.003)*1.5);
    drawBoat(c, dx+dw+8, dy+46, 54, 1);
    c.restore();
    /* 阿拼 ×5 像素缩放 */
    var im=IM.apin, sc=5, aw=32*sc, ah=32*sc;
    var ax=sceneApin.x, ay=sceneApin.y + (holdBob!=null?holdBob:Math.sin(t*0.004)*2);
    /* 身后一盏青柠光 */
    var lg=c.createRadialGradient(ax, ay-40, 4, ax, ay-20, 90);
    lg.addColorStop(0,'rgba(215,255,0,0.28)');
    lg.addColorStop(1,'rgba(215,255,0,0)');
    c.fillStyle=lg; c.beginPath(); c.arc(ax, ay-30, 90, 0, Math.PI*2); c.fill();
    if(im){
      c.imageSmoothingEnabled=false;
      c.drawImage(im, ax-aw/2, ay-ah, aw, ah);
    }
    /* 近处柔雾 */
    c.globalAlpha=0.12+Math.sin(t*0.0009)*0.04;
    c.drawImage(fogTile, -40+sway, 300, 256, 180);
    c.drawImage(fogTile, 160+sway, 340, 220, 160);
    c.globalAlpha=1;
    /* 前景虚化草树 */
    c.drawImage(fgGrass, -8+sway2, h-210, 380, 220);
    c.drawImage(fgGrass, 40-sway2*0.6, h-140, 400, 180);
  }

  function paint(t){
    var t0=performance.now();
    ctx.imageSmoothingEnabled=false;
    ctx.fillStyle=INK; ctx.fillRect(0,0,W,H);
    gtx.clearRect(0,0,gcv.width,gcv.height);

    var te=0, modeNow=mode;
    if(modeNow==='to-scene' || modeNow==='to-map') te=easeInOut(clamp(transT,0,1));
    else if(modeNow==='scene') te=1;

    /* 终端升起时压缩小景 */
    if(termWant>termOpen) termOpen=Math.min(1, termOpen+0.07);
    if(termWant<termOpen) termOpen=Math.max(0, termOpen-0.07);

    if(te===0 && modeNow==='map'){
      ctx.save();
      ctx.translate(-Math.round(cam.x), -Math.round(cam.y));
      drawMapWorld(ctx, t);
      var i;
      for(i=0;i<NPCS.length;i++) drawNpc(ctx, NPCS[i], t);
      drawPotato(ctx);
      for(i=0;i<NPCS.length;i++) drawLimeMark(ctx, NPCS[i], t);
      ctx.restore();
      drawEdgeHints(ctx);
      drawMinimap(ctx);
    } else {
      /* 地图过渡：放大 + 纵向拉伸（假俯仰）+ 虹膜，再淡入小景 */
      var ap=NPCS[1];
      var targetX=lerp(potato.x, ap.x, te);
      var targetY=lerp(potato.y, ap.y-8, te);
      var z=1+te*1.7;
      var ySquash=1+te*0.38;
      var cx=targetX, cy=targetY;
      var oldCamX=cam.x, oldCamY=cam.y;
      ctx.save();
      ctx.translate(W/2, H/2);
      ctx.scale(z, z*ySquash);
      ctx.translate(-cx, -cy);
      cam.x=cx-W/2/z-40; cam.y=cy-H/2/(z*ySquash)-40;
      drawMapWorld(ctx, t);
      var i;
      for(i=0;i<NPCS.length;i++) drawNpc(ctx, NPCS[i], t);
      drawPotato(ctx);
      for(i=0;i<NPCS.length;i++) drawLimeMark(ctx, NPCS[i], t);
      ctx.restore();
      cam.x=oldCamX; cam.y=oldCamY;
      if(te>0){
        var rad=(1-te)*420+16;
        ctx.fillStyle='rgba(17,20,17,'+(0.1+te*0.85)+')';
        ctx.beginPath(); ctx.rect(0,0,W,H);
        ctx.arc(W/2, H*0.48, rad, 0, Math.PI*2, true);
        ctx.fill();
      }
      if(te>0.32){
        var a=(te-0.32)/0.68;
        ctx.save();
        ctx.globalAlpha=a;
        var k=termOpen;
        var vis=lerp(H, H*ANS_TOP, k);
        var destFeet=lerp(sceneApin.y, vis-16, k);
        var focusY=destFeet-sceneApin.y;
        ctx.beginPath(); ctx.rect(0,0,W, k>0?vis+8:H); ctx.clip();
        ctx.translate(0, focusY);
        drawScene(ctx, t, H);
        ctx.restore();
      }
    }

    /* gcv：青柠微光（角色） */
    if(gcv.width){
      gtx.save();
      var dpr=gcv.width/W;
      gtx.scale(dpr,dpr);
      if(modeNow==='map' && te===0){
        gtx.translate(-Math.round(cam.x), -Math.round(cam.y));
        var gi, gn, grd;
        for(gi=0;gi<NPCS.length;gi++){
          gn=NPCS[gi]; if(gn.id==='snail') continue;
          grd=gtx.createRadialGradient(gn.x, gn.y-20, 2, gn.x, gn.y-20, 36);
          grd.addColorStop(0,'rgba(215,255,0,.28)'); grd.addColorStop(1,'rgba(215,255,0,0)');
          gtx.fillStyle=grd; gtx.beginPath(); gtx.arc(gn.x, gn.y-20, 36, 0, Math.PI*2); gtx.fill();
        }
      }
      gtx.restore();
    }
    frameMsLast=performance.now()-t0;
  }

  function step(dt, t){
    if(mode==='to-scene' || mode==='to-map'){
      if(!transFrozen){
        transT += transDir * (dt/transDur);
        if(transDir>0 && transT>=1){ transT=1; settleScene(); }
        if(transDir<0 && transT<=0){ transT=0; settleMap(); }
      }
    }
    if(mode==='map' && !paused){
      var sp=1.55*(dt/16.67), vx=0, vy=0;
      if(dirs.left) vx-=1; if(dirs.right) vx+=1;
      if(dirs.fwd) vy-=1; if(dirs.back) vy+=1;
      if(dest && vx===0 && vy===0){
        var ddx=dest.x-potato.x, ddy=dest.y-potato.y, dd=Math.hypot(ddx,ddy);
        if(dd<4){
          var npc=dest.npc; dest=null;
          if(npc && Math.hypot(npc.x-potato.x,npc.y-potato.y)<80) interact(npc);
        } else { vx=ddx/dd; vy=ddy/dd; }
      }
      if(vx||vy){
        var len=Math.hypot(vx,vy); vx=vx/len*sp; vy=vy/len*sp;
        var nx=potato.x+vx, ny=potato.y+vy;
        if(walkablePx(nx, potato.y)) potato.x=nx;
        if(walkablePx(potato.x, ny)) potato.y=ny;
      }
      var zn=zoneAt(potato.x,potato.y);
      if(zn!==zoneName){ zoneName=zn; document.getElementById('fSub').textContent=zn; }
      var hit=closestNpc(potato.x,potato.y);
      nearId=(hit.d<64 && hit.npc.interact)?hit.npc:null;
      if(nearId && dlg.hidden) hintEl.textContent='点按 · 与'+LINES[nearId.id].name+'交谈';
      else hintEl.textContent='拖动移动 · 靠近角色后点按';
    }
    /* 镜头跟随 */
    if(mode==='map'){
      var tx=clamp(potato.x-W/2, 0, MW-W);
      var ty=clamp(potato.y-H*0.55, 0, MH-H);
      cam.x+=(tx-cam.x)*0.14;
      cam.y+=(ty-cam.y)*0.14;
      if(Math.abs(cam.x-tx)<0.05) cam.x=tx;
      if(Math.abs(cam.y-ty)<0.05) cam.y=ty;
    }
  }

  function loop(now){
    if(!lastT) lastT=now;
    var dt=Math.min(48, now-lastT); lastT=now; time=now;
    step(dt, now);
    paint(now);
    fpsAcc.n++; if(!fpsAcc.t0) fpsAcc.t0=now;
    if(now-fpsAcc.t0>=500){ fpsAcc.last=fpsAcc.n*1000/(now-fpsAcc.t0); fpsAcc.n=0; fpsAcc.t0=now; }
    rafId=requestAnimationFrame(loop);
  }

  /* ===== 适配 ===== */
  function setH(h){
    if(h===H && cv.height===h) return;
    H=h; cv.height=H; cv.width=W;
    screenEl.style.setProperty('--h', H);
  }
  function measureLayout(){
    var r=screenEl.getBoundingClientRect(); if(!r.height) return;
    var hr=document.querySelector('.hud .rule').getBoundingClientRect(), br=hintEl.getBoundingClientRect();
    LAYOUT.top=(hr.bottom-r.top)/UNIT+4;
    LAYOUT.bot=(br.top-r.top)/UNIT-6;
    screenEl.style.setProperty('--th', Math.round(H*(1-ANS_TOP)));
    screenEl.style.setProperty('--toastTop', Math.round(LAYOUT.top+8));
  }
  function fit(){
    var vw=window.innerWidth, vh=window.innerHeight, phone=vw<=520, h;
    document.body.classList.toggle('phone', phone);
    if(phone){ UNIT=vw/W; h=Math.round(vh/UNIT); }
    else { UNIT=Math.max(0.3, Math.min((vw-60)/W, (vh-60)/780)); h=780; }
    h=Math.max(520, Math.min(1100, h));
    screenEl.style.setProperty('--u', UNIT);
    setH(h);
    var dpr=Math.min(3, window.devicePixelRatio||1);
    gcv.width=Math.round(W*UNIT*dpr); gcv.height=Math.round(H*UNIT*dpr);
    measureLayout();
    cam.x=clamp(potato.x-W/2,0,MW-W);
    cam.y=clamp(potato.y-H*0.55,0,MH-H);
  }
  window.addEventListener('resize', fit);

  /* 调试：连点 1F 五下 */
  (function(){
    var taps=[];
    document.getElementById('fNum').addEventListener('click', function(){
      var t=Date.now(); taps=taps.filter(function(x){ return t-x<3000; }); taps.push(t);
      if(taps.length>=5){ taps=[]; document.body.classList.toggle('debug'); measureLayout(); }
    });
  })();
  var bCrt=document.getElementById('bCrt');
  bCrt.addEventListener('click', function(){ var off=document.body.classList.toggle('nocrt'); bCrt.textContent=off?'CRT 关':'CRT 开'; });
  document.getElementById('bMap').addEventListener('click', function(){
    showMini=!showMini; this.classList.toggle('on', showMini);
  });
  document.getElementById('bAsk').addEventListener('click', function(){
    if(mode==='map'){ potato.x=NPCS[1].x-20; potato.y=NPCS[1].y+10; cam.x=clamp(potato.x-W/2,0,MW-W); cam.y=clamp(potato.y-H*0.55,0,MH-H); startEnter(); }
    else if(mode==='scene'){ closeDlg(); answered={}; answers.length=0; enterAnswer(); }
  });

  function fps(ms){
    return new Promise(function(res){
      var n=0, t0=performance.now();
      function tick(){
        n++;
        if(performance.now()-t0>=ms) res(n*1000/(performance.now()-t0));
        else requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    });
  }
  function gotoZone(name){
    var z={wuwu:{x:45*TW+6,y:190*TW}, apin:{x:70*TW,y:148*TW}, feng:{x:45*TW+6,y:78*TW}, start:{x:45*TW+6,y:218*TW+6}};
    var p=z[name]||z.start;
    potato.x=p.x; potato.y=p.y;
    cam.x=clamp(potato.x-W/2,0,MW-W);
    cam.y=clamp(potato.y-H*0.55,0,MH-H);
    document.getElementById('fSub').textContent=zoneAt(potato.x,potato.y);
  }
  function teleport(x,y){
    potato.x=x; potato.y=y;
    cam.x=clamp(potato.x-W/2,0,MW-W);
    cam.y=clamp(potato.y-H*0.55,0,MH-H);
  }

  window.__v4={
    teleport:teleport, gotoZone:gotoZone,
    enterApin:function(){ if(mode==='map') startEnter(); },
    setTransition:function(t){
      if(mode==='map' || mode==='to-map'){ mode='to-scene'; }
      transT=clamp(t,0,1); transFrozen=true; transDir=1; paused=true;
    },
    settleScene:function(){ transFrozen=false; settleScene(); },
    openDialogue:function(){ if(mode!=='scene') settleScene(); },
    enterAnswer:function(){ if(mode!=='scene') settleScene(); closeDlg(); enterAnswer(); },
    finishTyping:finishTyping,
    exitToMap:function(){ transFrozen=false; startExit(); },
    fps:fps, frameMs:function(){ return frameMsLast; },
    answers:answers, mode:function(){ return mode; }, trans:function(){ return transT; },
    debug:function(on){ document.body.classList.toggle('debug', !!on); measureLayout(); },
    minimap:function(on){ showMini=!!on; },
    holdBob:function(v){ holdBob=v; },
    npcAt:function(id){ var i,n; for(i=0;i<NPCS.length;i++){ n=NPCS[i]; if(n.id===id) return {x:n.x,y:n.y}; } },
    potato:potato, cam:cam, W:function(){ return W; }, H:function(){ return H; }
  };
  /* 兼容旧钩子名，方便复用验证思路 */
  window.__v3=window.__v4; window.__v2=window.__v4;

  function punchBg(im){
    var c=document.createElement('canvas'); c.width=im.width; c.height=im.height;
    var g=c.getContext('2d'); g.drawImage(im,0,0);
    var d=g.getImageData(0,0,c.width,c.height), px=d.data, w=c.width, h=c.height, stack=[];
    function isInk(i){ return px[i+3]>0 && px[i]<28 && px[i+1]<30 && px[i+2]<28; }
    function push(x,y){
      if(x<0||y<0||x>=w||y>=h) return;
      var i=(y*w+x)*4; if(!isInk(i)) return;
      px[i+3]=0; stack.push(x,y);
    }
    var x,y;
    for(x=0;x<w;x++){ push(x,0); push(x,h-1); }
    for(y=0;y<h;y++){ push(0,y); push(w-1,y); }
    while(stack.length){ y=stack.pop(); x=stack.pop(); push(x+1,y); push(x-1,y); push(x,y+1); push(x,y-1); }
    g.putImageData(d,0,0); return c;
  }
  function boot(){
    buildMap();
    fit();
    function go(){ paintLabels(); requestAnimationFrame(loop); }
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else setTimeout(go, 80);
  }
  var left=3;
  function one(){
    if(--left<=0){
      IM.apin=punchBg(IM.apin); IM.wuwu=punchBg(IM.wuwu); IM.feng=punchBg(IM.feng);
      boot();
    }
  }
  ['apin','wuwu','feng'].forEach(function(k){
    var im=new Image();
    im.onload=one; im.onerror=one;
    im.src='data:image/png;base64,'+SPRITES[k];
    IM[k]=im;
  });
})();
</script>
